name: 🚀 Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_NAME: acrigolankaprod
  ACR_URL: acrigolankaprod.azurecr.io
  IMAGE_NAME: igolanka-backend
  CONTAINER_APP_NAME: api-backend
  RESOURCE_GROUP: rg-igolanka-central

jobs:
  # ──────────────────────────────────────────────────────────────────
  # JOB 1: Lint & Security Audit
  # ──────────────────────────────────────────────────────────────────
  lint-and-audit:
    name: 🔍 Lint & Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (non-blocking)
        run: npm audit --audit-level=high || true

  # ──────────────────────────────────────────────────────────────────
  # JOB 2: Build Docker Image & Push to ACR (main branch only)
  # ──────────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    needs: lint-and-audit
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_sha: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_URL }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────
  # JOB 3: Deploy to Azure Container Apps
  # ──────────────────────────────────────────────────────────────────
  deploy:
    name: ☁️ Deploy to Azure
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: ${{ env.ACR_NAME }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          imageToDeploy: ${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

      - name: Verify deployment health
        run: |
          echo "Waiting 30s for container to start..."
          sleep 30
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking health at https://$FQDN/health"
          curl -f "https://$FQDN/health" || (echo "Health check failed!" && exit 1)

      - name: Post deployment summary
        if: always()
        run: |
          echo "### 🚀 Backend Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Container App:** \`${{ env.CONTAINER_APP_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
